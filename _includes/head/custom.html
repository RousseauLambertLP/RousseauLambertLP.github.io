{% if page.lang == 'fr' %}
<link rel="alternate" type="application/rss+xml" title="Vigie technologique — Français" href="{{ '/vigie/feed.xml' | absolute_url }}">
{% else %}
<link rel="alternate" type="application/rss+xml" title="Technology watch — English" href="{{ '/en/vigie/feed.xml' | absolute_url }}">
{% endif %}
{% if page.translation_url %}
<link rel="alternate" hreflang="{{ page.lang | default: 'en' }}" href="{{ page.url | absolute_url }}">
<link rel="alternate" hreflang="{% if page.lang == 'fr' %}en{% else %}fr{% endif %}" href="{{ page.translation_url | absolute_url }}">
{% endif %}
